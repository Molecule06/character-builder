<title>Membrane</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,500&display=swap">
<style>
  /* Layout: one full-bleed microscope stage; slide annotations sit in the corners like a lab label. */
  :root {
    --slide: #e6e5ea;          /* glass slide ground, also behind the canvas while it boots */
    --ink: #2c2238;            /* annotation text */
    --ink-soft: #6c6378;       /* secondary annotation text */
    --stain: #8f45b4;          /* the violet stain, used for focus rings */
    --label: rgba(246, 245, 249, 0.72);  /* frosted label behind controls */
    --rule: rgba(44, 34, 56, 0.55);
    --font-display: "Fraunces", "Iowan Old Style", Georgia, serif;
    --font-data: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
    color-scheme: light;
  }
  html, body { height: 100%; }
  body { background: var(--slide); color: var(--ink); overflow: hidden; font-family: var(--font-data); }
  .stage { position: relative; height: 100%; width: 100%; overflow: hidden; touch-action: none; }
  .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: default; }
  .stage.can-grab canvas { cursor: grab; }
  .stage.grabbing canvas { cursor: grabbing; }
  .hud {
    position: absolute; inset: 0; pointer-events: none;
    display: flex; flex-direction: column; justify-content: space-between;
    padding-block: 16px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .row { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
  .row.top { align-items: flex-start; }
  .name { font-family: var(--font-display); font-size: 1.5rem; line-height: 1; letter-spacing: -0.01em; margin: 0; }
  .note { font-size: 0.72rem; line-height: 1.5; color: var(--ink-soft); margin: 6px 0 0; max-width: 34ch; }
  .meta { font-size: 0.68rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-soft); text-align: right; }
  .scale { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; font-size: 0.68rem; color: var(--ink-soft); }
  .scale i { display: block; width: 88px; height: 5px; border: 1px solid var(--rule); border-top: 0; }
  button#again, button#kill {
    pointer-events: auto; font: 500 0.72rem var(--font-data); letter-spacing: 0.04em;
    color: var(--ink); background: var(--label); border: 1px solid var(--rule); border-radius: 2px;
    padding: 8px 12px; cursor: pointer; backdrop-filter: blur(6px);
  }
  button#again:hover, button#kill:hover { background: #fff; }
  button#again:focus-visible, button#kill:focus-visible { outline: 2px solid var(--stain); outline-offset: 2px; }
  .btns { display: flex; gap: 8px; }
  .fail { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; font-size: 0.85rem; color: var(--ink); }
</style>

<div class="stage" id="stage">
  <div class="hud">
    <div class="row top">
      <div>
        <h1 class="name">Membrane</h1>
        <p class="note" id="note">Grab the cell anywhere and pull it about. Yank the wall hard, or double-click it, and it tears.</p>
      </div>
      <div class="btns"><button id="kill" type="button">Kill</button><button id="again" type="button">New specimen</button></div>
    </div>
    <div class="row">
      <div class="meta" style="text-align:left">Specimen <span id="specimen">01</span> · violet stain · 400×</div>
      <div class="scale"><i></i><span>20 µm</span></div>
    </div>
  </div>
  <div class="fail" id="fail" hidden>This specimen needs WebGL 2, which this browser did not provide.</div>
</div>

<script type="module">

function createSim(seed) {

// ───────────────────────── view + input ─────────────────────────
function resize() {

const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -H), hit = new THREE.Vector3();
